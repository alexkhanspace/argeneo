name: CI

# Vérification (build backend + frontend) sans déploiement : branche dev et pull requests.
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build backend (bootJar + compilation des tests)
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar compileTestJava

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (typecheck + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Lint (informatif)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint
